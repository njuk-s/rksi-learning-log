# Бесплатный Render усыпляет сервис после 15 минут без запросов, и первое
# открытие после сна занимает около 30 секунд. Этот workflow открывает /healthz/
# каждые 10 минут в рабочее время (будни, 8:00-17:00 по Москве), чтобы сайт
# открывался сразу. Круглосуточно будить нельзя: 750 бесплатных часов в месяц
# делятся на все сервисы аккаунта. /healthz/ не обращается к базе данных.
name: keepalive

on:
  schedule:
    - cron: "*/10 5-13 * * 1-5"   # время UTC = Москва - 3 часа
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 10 --max-time 90 https://njuk-learning-log.onrender.com/healthz/
